<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to PetCare Manager</h1>
    </header>

    <section id="doctorProfile">
        <h2>Doctor's Profile</h2>
        <p>Name: Keza Millajoie Appoline</p>
        <p>Specialization: Veterinary Medicine</p>
        <p>Experience: 10 years in treating cats and dogs</p>
        <p>Contact: dr.alex.johnson@example.com</p>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <textarea id="aboutMe" rows="4" placeholder="Tell us about yourself..."></textarea>
    </section>

    <section id="appointments">
        <h2>Schedule an Appointment</h2>
        <form id="appointmentForm">
            <input type="text" id="petName" placeholder="Pet Name" required>
            <input type="text" id="appointmentDate" placeholder="Appointment Date (YYYY-MM-DD)" required>
            <button type="submit">Schedule Appointment</button>
        </form>
        <div id="appointmentList"></div>
    </section>

    <section id="healthRecords">
        <h2>Health Records</h2>
        <textarea id="healthRecordsInput" rows="4" placeholder="Enter health records..."></textarea>
        <button id="saveRecords">Save Records</button>
        <div id="recordConfirmation"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
